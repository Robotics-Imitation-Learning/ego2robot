name: Build lightweight README video previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readme_previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg on GitHub-hosted runner
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build genuine moving previews from committed Aria MP4s
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i data/cda03c03-68c9-4caf-9deb-5a5fa091ab0e_480_gaze_red_circle.mp4 \
            -filter_complex '[0:v]fps=0.5,scale=390:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5' \
            -loop 0 docs/media/full_procedure_preview.gif
          ffmpeg -hide_banner -loglevel error -y \
            -i data/19a5c812-520b-4f8f-89ee-9b7b0879ca23_480_gaze_red_circle.mp4 \
            -filter_complex '[0:v]fps=4,scale=390:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5' \
            -loop 0 docs/media/step1_preview.gif
          ls -lh docs/media/*preview.gif
      - name: Commit generated genuine Aria previews to the single main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/full_procedure_preview.gif docs/media/step1_preview.gif
          git diff --cached --quiet || git commit -m "Add animated previews of actual Aria gaze videos"
          git pull --rebase origin main
          git push
