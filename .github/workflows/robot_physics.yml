name: MuJoCo grasp physics smoke test
on:
  push:
    paths:
      - 'Ego2Robot_scene/pick_place.py'
      - 'Ego2Robot_scene/challenge_scene.py'
      - '.github/workflows/robot_physics.yml'
  workflow_dispatch:

jobs:
  grasp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Download official Reachy 2 MJCF assets
        run: git clone --depth 1 https://github.com/pollen-robotics/reachy2_mujoco_assets.git
      - name: Build dynamic challenge scene
        run: python Ego2Robot_scene/challenge_scene.py --reachy-assets reachy2_mujoco_assets
      - name: Validate physics scene
        run: python Ego2Robot_scene/smoke_test.py reachy2_mujoco_assets/scenes/ego2robot_challenge.xml --settle
      - name: Physical grasp and placement parameter sweep
        run: |
          set -euo pipefail
          unset MUJOCO_GL
          success=0
          for pad in 3 4 5 6; do
            python Ego2Robot_scene/challenge_scene.py \
              --reachy-assets reachy2_mujoco_assets \
              --finger-pad-mm "$pad"
            for height in 0.010 0.012 0.014 0.016; do
              echo "=== PAD ${pad}mm, PINCH HEIGHT ${height}m ==="
              if python -u Ego2Robot_scene/pick_place.py \
                  reachy2_mujoco_assets/scenes/ego2robot_challenge.xml \
                  --mode execute --grasp-style side --pinch-height "$height" \
                  > /tmp/grasp_try.log 2>&1; then
                true
              fi
              grep -E 'grasp: executed|after close:|Cube lifted by|One-second static hold|GRASP NOT|after_transport:|before_release:|after release:|cube_in_bin_oracle|Task unsuccessful|PASS: physical' /tmp/grasp_try.log || true
              if grep -q 'PASS: physical cube-in-bin predicate satisfied.' /tmp/grasp_try.log; then
                echo "PHYSICAL PLACE SUCCESS: pad=${pad}mm, pinch_height=${height}m"
                success=1
                break 2
              fi
            done
          done
          if [ "$success" -ne 1 ]; then
            echo "No verified stable physical place in the tested grid."
            exit 1
          fi
