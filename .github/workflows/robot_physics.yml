name: MuJoCo grasp physics smoke test
on:
  push:
    paths:
      - 'Ego2Robot_scene/pick_place.py'
      - 'Ego2Robot_scene/challenge_scene.py'
      - '.github/workflows/robot_physics.yml'
  workflow_dispatch:

jobs:
  grasp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Download official Reachy 2 MJCF assets
        run: git clone --depth 1 https://github.com/pollen-robotics/reachy2_mujoco_assets.git
      - name: Build dynamic challenge scene
        run: python Ego2Robot_scene/challenge_scene.py --reachy-assets reachy2_mujoco_assets
      - name: Validate physics scene
        run: python Ego2Robot_scene/smoke_test.py reachy2_mujoco_assets/scenes/ego2robot_challenge.xml --settle
      - name: Execute automatic side-pinch clearance sweep
        run: |
          set -o pipefail
          # No offscreen render is requested in CI: use MuJoCo CPU physics
          # directly, without EGL (which requires a configured driver).
          unset MUJOCO_GL
          python -u Ego2Robot_scene/pick_place.py \
            reachy2_mujoco_assets/scenes/ego2robot_challenge.xml \
            --mode execute --grasp-style side --auto-clearance 2>&1 | tee /tmp/grasp.log
