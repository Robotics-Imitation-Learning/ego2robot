name: MuJoCo grasp physics smoke test
on:
  push:
    paths:
      - 'Ego2Robot_scene/pick_place.py'
      - 'Ego2Robot_scene/challenge_scene.py'
      - 'Ego2Robot_scene/execute_demo.py'
      - 'tests/fixtures/synthetic_plan.json'
      - '.github/workflows/robot_physics.yml'
  workflow_dispatch:

jobs:
  grasp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal CPU simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Download official Reachy 2 MJCF assets
        run: git clone --depth 1 https://github.com/pollen-robotics/reachy2_mujoco_assets.git
      - name: Build dynamic challenge scene
        run: python Ego2Robot_scene/challenge_scene.py --reachy-assets reachy2_mujoco_assets
      - name: Validate physics scene
        run: python Ego2Robot_scene/smoke_test.py reachy2_mujoco_assets/scenes/ego2robot_challenge.xml --settle
      - name: Verified white cube-to-bin regression
        run: |
          set -euo pipefail
          unset MUJOCO_GL
          python -u Ego2Robot_scene/pick_place.py \
            reachy2_mujoco_assets/scenes/ego2robot_challenge.xml \
            --object white_cube --mode execute --grasp-style side \
            --pinch-height 0.010 2>&1 | tee /tmp/white.log
          grep -q 'PASS: physical cube-in-bin predicate satisfied.' /tmp/white.log

      - name: Check annotated-task runner interface (synthetic fixture only)
        run: |
          unset MUJOCO_GL
          python -u Ego2Robot_scene/execute_demo.py \
            reachy2_mujoco_assets/scenes/ego2robot_challenge.xml \
            --plan tests/fixtures/synthetic_plan.json --max-steps 1
          # Fixture is NOT user data; this checks only API/physical control.

      - name: Probe all cube colours in the compact layout
        run: |
          set -u
          unset MUJOCO_GL
          python Ego2Robot_scene/challenge_scene.py \
            --reachy-assets reachy2_mujoco_assets --layout compact
          for color in white red black; do
            echo "=== COMPACT ${color} cube -> ${color} bin ==="
            if python -u Ego2Robot_scene/pick_place.py \
                reachy2_mujoco_assets/scenes/ego2robot_compact.xml \
                --object "${color}_cube" --mode execute \
                --grasp-style side --pinch-height 0.010 \
                --approach-open-angle 1.0 \
                > "/tmp/compact_${color}.log" 2>&1; then
              code=0
            else
              code=$?
            fi
            grep -E 'pregrasp: IK|grasp: executed|First gripper/robot|at grasp: pinch|Cube contacts after closure:|Cube lifted by|One-second static hold|after_transport:|cube_in_bin_oracle|Task unsuccessful|PASS: physical|RuntimeError' "/tmp/compact_${color}.log" || true
            echo "COMPACT ${color} exit status: $code (exploratory)"
          done

      - name: Black cube physical grasp sensitivity (diagnostic only)
        run: |
          unset MUJOCO_GL
          for opening in 0.8 1.0 1.2 1.6; do
            for height in 0.008 0.010 0.012 0.014; do
              echo "=== BLACK opening=${opening}, height=${height} ==="
              if python -u Ego2Robot_scene/pick_place.py \
                  reachy2_mujoco_assets/scenes/ego2robot_compact.xml \
                  --object black_cube --mode execute --grasp-style side \
                  --approach-open-angle "$opening" --pinch-height "$height" \
                  > /tmp/black_try.log 2>&1; then
                status=0
              else
                status=$?
              fi
              grep -E 'Cube lifted by|One-second static hold|after_transport:|GRASP NOT|cube_in_bin_oracle|RuntimeError|PASS: physical' /tmp/black_try.log || true
              if [ "$status" -eq 0 ] && grep -q 'PASS: physical cube-in-bin predicate satisfied.' /tmp/black_try.log; then
                echo "BLACK PHYSICAL PLACE SUCCESS opening=${opening} height=${height}"
                exit 0
              fi
            done
          done
          echo "No black-cube physical placement achieved in diagnostic sweep."
          # Only white is a strict gating regression today.

      - name: Measure right-arm feasible tabletop band
        run: |
          unset MUJOCO_GL
          python -u Ego2Robot_scene/workspace_probe.py \
            reachy2_mujoco_assets/scenes/ego2robot_challenge.xml
