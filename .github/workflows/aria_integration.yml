name: Aria grounding integration unit tests
on:
  push:
    paths:
      - 'Ego2Robot_scene/aria_ingest.py'
      - 'Ego2Robot_scene/grounded_plan.py'
      - 'Ego2Robot_scene/state_probe.py'
      - 'Ego2Robot_scene/run_grounded.py'
      - 'Ego2Robot_scene/vjepa2_encoder.py'
      - 'Ego2Robot_scene/learn_grounding.py'
      - 'tests/test_aria_pipeline.py'
      - '.github/workflows/aria_integration.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight grounding dependencies
        run: python -m pip install numpy
      - name: Check syntax of all pipeline entrypoints
        run: |
          python -m py_compile Ego2Robot_scene/aria_ingest.py Ego2Robot_scene/grounded_plan.py Ego2Robot_scene/vjepa2_encoder.py Ego2Robot_scene/state_probe.py Ego2Robot_scene/run_grounded.py Ego2Robot_scene/learn_grounding.py
      - name: Run synthetic contract tests (not real-recording validation)
        run: python -m unittest discover -s tests -p test_aria_pipeline.py -v
