name: Reachy head RGB and segmentation smoke test
on:
  push:
    paths:
      - 'Ego2Robot_scene/render_gaze_reference.py'
      - '.github/workflows/gaze_render.yml'
  workflow_dispatch:
jobs:
  head_render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSMesa for CPU offscreen rendering
        run: sudo apt-get update -qq && sudo apt-get install -y libosmesa6 libosmesa6-dev libgl1-mesa-dev
      - name: Install MuJoCo and renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Clone official robot scene assets
        run: git clone --depth 1 https://github.com/pollen-robotics/reachy2_mujoco_assets.git
      - name: Build challenge scene
        run: python Ego2Robot_scene/challenge_scene.py --reachy-assets reachy2_mujoco_assets
      - name: Render Reachy RGB and object masks
        run: |
          python Ego2Robot_scene/render_gaze_reference.py \
            reachy2_mujoco_assets/scenes/ego2robot_challenge.xml \
            --out outputs/gaze_reference_ci
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          p=Path("outputs/gaze_reference_ci")
          masks=np.load(p/"robot_oracle_masks.npz")
          for name in ("white_cube","white_bin"):
              pixels=int(masks[name].sum())
              assert pixels>=10, f"{name} not visible"
              print(name,pixels)
          PY
